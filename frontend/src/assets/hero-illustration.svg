<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft sky and terrain gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2C17C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C49A45" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="terrace1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF3EC" />
      <stop offset="100%" stop-color="#DFE7DA" />
    </linearGradient>
    <linearGradient id="terrace2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A4B69A" />
      <stop offset="100%" stop-color="#889E7D" />
    </linearGradient>
    <linearGradient id="terrace3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F5D50" />
      <stop offset="100%" stop-color="#244B40" />
    </linearGradient>
    <linearGradient id="soilBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C3B32" />
      <stop offset="100%" stop-color="#10231D" />
    </linearGradient>
  </defs>

